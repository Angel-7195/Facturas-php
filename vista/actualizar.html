<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Actualizar producto</title>
</head>

<body>

    <h1>Actualizar producto</h1>

    <!-- Buscar producto -->

    <label>Código del producto:</label>

    <input
        type="text"
        id="codigoBuscar"
    >

    <button type="button" onclick="buscarProducto()">
        Buscar
    </button>

    <br><br>

    <!-- Formulario de actualización -->

    <form id="formActualizar" style="display: none;">

        <label>Código:</label>

        <input
            type="text"
            id="codigo"
            name="codigo"
            readonly
        >

        <br><br>

        <label>Nombre:</label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            required
        >

        <br><br>

        <label>Stock:</label>

        <input
            type="number"
            id="stock"
            name="stock"
            required
        >

        <br><br>

        <label>Valor unitario:</label>

        <input
            type="number"
            id="valorUnitario"
            name="valorUnitario"
            step="0.01"
            required
        >

        <br><br>

        <button type="submit">
            Actualizar producto
        </button>

    </form>

    <p id="mensaje"></p>

    <br>

    <a href="index.html">
        Volver al registro
    </a>


    <script>

        function buscarProducto() {

            const codigo =
                document.getElementById("codigoBuscar").value;

            fetch(
                "../control/buscarProducto.php?codigo="
                + encodeURIComponent(codigo)
            )

                .then(respuesta => respuesta.json())

                .then(producto => {

                    const mensaje =
                        document.getElementById("mensaje");

                    if (producto === null) {

                        mensaje.innerHTML =
                            "Producto no encontrado";

                        document.getElementById(
                            "formActualizar"
                        ).style.display = "none";

                        return;
                    }

                    // Colocamos los datos actuales

                    document.getElementById("codigo").value =
                        producto.codigo;

                    document.getElementById("nombre").value =
                        producto.nombre;

                    document.getElementById("stock").value =
                        producto.stock;

                    document.getElementById("valorUnitario").value =
                        producto.valorUnitario;

                    // Mostramos el formulario

                    document.getElementById(
                        "formActualizar"
                    ).style.display = "block";

                    mensaje.innerHTML = "";

                })

                .catch(error => {

                    console.error("Error:", error);

                });

        }


        document.getElementById(
            "formActualizar"
        ).addEventListener("submit", function(event) {

            // Evita que la página se recargue
            event.preventDefault();

            const datos =
                new FormData(this);

            fetch("../control/actualizarProducto.php", {

                method: "POST",
                body: datos

            })

                .then(respuesta => respuesta.text())

                .then(mensaje => {

                    document.getElementById(
                        "mensaje"
                    ).innerHTML = mensaje;

                })

                .catch(error => {

                    console.error("Error:", error);

                });

        });

    </script>

</body>

</html>
