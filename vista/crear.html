<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Productos</title>
</head>

<body>

    <h1>Registro de productos</h1>

    <form action="../control/guardarProducto.php" method="POST">
        
        <label>Código:</label>
        <input type="text" name="codigo" required>

        <br><br>

        <label>Nombre:</label>
        <input type="text" name="nombre" required>

        <br><br>

        <label>Stock:</label>
        <input type="number" name="stock" required>

        <br><br>

        <label>Valor unitario:</label>
        <input type="number" name="valorUnitario" step="0.01" required>

        <br><br>

        <button type="submit">
            Crear producto
        </button>

    </form>

    <a href="listar.html">
        Ver productos
    </a>

</body>

</html>
